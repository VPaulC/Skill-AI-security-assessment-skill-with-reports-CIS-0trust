name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Compile setup executable
        working-directory: installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" TenantAiAssessment.iss'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Tenant-AI-Security-Assessment-Setup-${{ github.run_number }}
          path: installer/Output/Tenant-AI-Security-Assessment-Setup.exe
          if-no-files-found: error
          retention-days: 30
